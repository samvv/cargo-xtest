[profile.default]
timeout = "60s"

[[profile.default.overrides]]
filter = "binary(greeting)"
uses = ["greeter"]
include-ignored = true

[[profile.default.overrides]]
filter = "binary(redis)"
uses = ["redis"]
include-ignored = true

[[profile.default.overrides]]
filter = "package(myapp) & test(=creates_archive)"
run-in = "borg"
include-ignored = true

[fixture.greeter]
kind = "command"
setup = "./scripts/greeter-up.sh"
teardown = "rm -f {handle}"

[fixture.redis]
kind = "docker"
image = "redis:7-alpine"
scope = "run"
ready = { cmd = ["redis-cli", "ping"], timeout = "30s" }
export = { REDIS_ADDR = "{host}:{port:6379}" }

[fixture.borg]
kind = "docker"
build = { dockerfile = "tests/docker/borg.Dockerfile", context = "tests/docker" }

# `cargo xtest --profile k8s`: needs k3d and docker on the host.
[[profile.k8s.overrides]]
filter = "binary(k8s)"
uses = ["k8s"]
include-ignored = true

[[profile.k8s.overrides]]
filter = "binary(k8s_env)"
run-in = "k8s"
include-ignored = true

[fixture.k8s]
kind = "k3d"
scope = "run"
agents = 1
args = ["--no-lb"]
ready = { cmd = "kubectl wait --for=condition=Ready nodes --all --timeout=10s", timeout = "180s" }
export = { K3D_CLUSTER = "{cluster}" }
# Used with `run-in`: tests run in this container, with KUBECONFIG and kubectl.
runner = { image = "archlinux:latest" }

[package]
name = "cargo-xtest"
description = "A cargo test runner that runs tests on remote hosts and inside fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cargo-xtest"
path = "src/main.rs"

[[bin]]
name = "xtest-agent"
path = "src/bin/xtest-agent.rs"

[dependencies]
xtest-proto.workspace = true
xtest-agent.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
libc.workspace = true
sha2.workspace = true
hex.workspace = true
clap = { version = "4", features = ["derive"] }
toml = "0.8"
cargo_metadata = "0.19"
ignore = "0.4"
globset = "0.4"
regex = "1"

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  demo:
    name: Demo (${{ matrix.profile }} profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [default, k8s]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/demo
      # The sandbox needs unprivileged user namespaces, which Ubuntu's
      # AppArmor policy blocks by default.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install k3d
        if: matrix.profile == 'k8s'
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          # The k8s profile runs several clusters at once; every k3s node uses
          # many inotify instances, more than Ubuntu's default 128 allows.
          sudo sysctl -w fs.inotify.max_user_instances=1024
          sudo sysctl -w fs.inotify.max_user_watches=1048576
      - name: Build cargo-xtest
        run: |
          cargo build
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - name: Run the demo
        working-directory: examples/demo
        run: cargo xtest --profile ${{ matrix.profile }}
